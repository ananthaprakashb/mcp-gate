services:
  gate:
    build:
      context: ..
    environment:
      GATE_SIGNING_KEY: demo-signing-key-change-me-000000000000
      GATE_ADMIN_KEY: demo-admin-key
      GATE_ROUTES: >-
        [{"name":"tickets","upstream":"http://mock-api:8081","path_prefix":"/v1/tickets","methods":["POST"],"max_ttl_seconds":30,"upstream_auth":{"headers":{"X-API-Key":"demo-upstream-key"},"query":{"tenant":"demo"}},"request_schema":{"type":"object","properties":{"title":{"type":"string","minLength":1,"maxLength":120},"priority":{"type":"string","enum":["low","high"]}},"required":["title"]}}]
    networks:
      - demo
    ports:
      - "8080:8080"

  mock-api:
    image: python:3.12-alpine
    command: ["python", "/app/mock_api.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 1s
      timeout: 2s
      retries: 10
    networks:
      - demo
    volumes:
      - ./mock_api.py:/app/mock_api.py:ro

  agent:
    image: python:3.12-alpine
    command: ["python", "/app/agent.py"]
    depends_on:
      mock-api:
        condition: service_healthy
      gate:
        condition: service_started
    environment:
      GATE_URL: http://gate:8080
      GATE_ADMIN_KEY: demo-admin-key
    networks:
      - demo
    volumes:
      - ./agent.py:/app/agent.py:ro

networks:
  demo:
